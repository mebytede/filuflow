# filuflow master: users, projects, tenants, workers. Does not execute workflows itself.
#   FILUFLOW_ENCRYPTION_KEY=... FILUFLOW_PUBLIC_URL=https://filuflow.example docker compose -f docker-compose.master.yml up -d
# On first start the setup token is printed to the log (docker compose logs); alternatively set FILUFLOW_ADMIN_EMAIL/-PASSWORD.
services:
  master:
    build: .
    image: filuflow:latest
    restart: unless-stopped
    ports:
      - "5679:5679"
    environment:
      FILUFLOW_PORT: "5679"
      FILUFLOW_ENCRYPTION_KEY: ${FILUFLOW_ENCRYPTION_KEY:?set FILUFLOW_ENCRYPTION_KEY (at least 16 characters, keep it safe)}
      FILUFLOW_PUBLIC_URL: ${FILUFLOW_PUBLIC_URL:-http://localhost:5679}
      # behind a reverse proxy with HTTPS:
      FILUFLOW_TRUST_PROXY: ${FILUFLOW_TRUST_PROXY:-false}
      FILUFLOW_ADMIN_EMAIL: ${FILUFLOW_ADMIN_EMAIL:-}
      FILUFLOW_ADMIN_PASSWORD: ${FILUFLOW_ADMIN_PASSWORD:-}
      # OIDC (optional): FILUFLOW_OIDC_ISSUER, FILUFLOW_OIDC_CLIENT_ID, FILUFLOW_OIDC_CLIENT_SECRET, ...
      FILUFLOW_OIDC_ISSUER: ${FILUFLOW_OIDC_ISSUER:-}
      FILUFLOW_OIDC_CLIENT_ID: ${FILUFLOW_OIDC_CLIENT_ID:-}
      FILUFLOW_OIDC_CLIENT_SECRET: ${FILUFLOW_OIDC_CLIENT_SECRET:-}
    volumes:
      - filuflow-master:/data/state
    command: ["node", "/app/bin/filuflow.js", "master", "--db", "/data/state/master.db"]
volumes:
  filuflow-master:
