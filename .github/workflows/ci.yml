# Checks on every pull request and push to main: lint and types, tests (including browser tests with Chromium),
# golden tests against fixtures/ and a trial build of the Docker image. On main the image is also pushed to the
# GitHub Container Registry (ghcr.io/<owner>/filuflow, tags main and commit SHA).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium for the browser tests (without a browser they would be skipped)
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npm run test:compat
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t filuflow:ci .
      - name: Start image and check health
        run: |
          docker run -d --name filuflow-ci -p 5678:5678 -e FILUFLOW_API_KEY=ci-key filuflow:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5678/healthz; then echo; docker rm -f filuflow-ci; exit 0; fi
            sleep 2
          done
          docker logs filuflow-ci
          exit 1
      - name: Push to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/filuflow
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag filuflow:ci "$IMAGE:main"
          docker tag filuflow:ci "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:main"
          docker push "$IMAGE:${{ github.sha }}"
