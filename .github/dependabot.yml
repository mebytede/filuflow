# Weekly dependency updates; minor and patch updates are grouped into one pull request per ecosystem.
# Libraries pinned to the versions of the n8n reference (docs/DECISIONS.md, "Versions like n8n") are ignored: they are
# only updated together with the reference version and the golden tests. Node.js stays on 22 LTS (CLAUDE.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: luxon
      - dependency-name: lodash
      - dependency-name: cheerio
      - dependency-name: html-to-text
      - dependency-name: xml2js
      - dependency-name: qs
      - dependency-name: jsonrepair
      - dependency-name: jmespath
      - dependency-name: title-case
      - dependency-name: transliteration
      - dependency-name: alasql
      - dependency-name: math-expression-evaluator
      - dependency-name: pyodide
      # matches the Chromium used by the browser tests
      - dependency-name: playwright-core
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
