# filuflow worker in a tenant's environment. The master connects here using FILUFLOW_API_KEY.
#   FILUFLOW_API_KEY=... FILUFLOW_ENCRYPTION_KEY=... FILUFLOW_WEBHOOK_URL=https://flows.customer.example/ \
#     docker compose -f docker-compose.worker.yml up -d
services:
  worker:
    build: .
    image: filuflow:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      FILUFLOW_API_KEY: ${FILUFLOW_API_KEY:?set FILUFLOW_API_KEY (at least 16 characters, enter it for the worker in the master)}
      # encrypts the credentials set by the master (credentials.managed.json)
      FILUFLOW_ENCRYPTION_KEY: ${FILUFLOW_ENCRYPTION_KEY:-}
      FILUFLOW_WEBHOOK_URL: ${FILUFLOW_WEBHOOK_URL:-http://localhost:5678/}
      FILUFLOW_TIMEZONE: ${FILUFLOW_TIMEZONE:-Europe/Berlin}
      FILUFLOW_MANAGED_CREDENTIALS: /data/state/credentials.managed.json
    volumes:
      # the master writes workflows; files added by hand are left untouched
      - filuflow-workflows:/data/workflows
      - filuflow-state:/data/state
      # optional, maintained by hand (cannot be overwritten by the master):
      # - ./credentials.json:/data/credentials.json:ro
    command: ["node", "/app/bin/filuflow.js", "worker", "--db", "/data/state/filuflow.db"]
volumes:
  filuflow-workflows:
  filuflow-state:
